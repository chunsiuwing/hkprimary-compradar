    const GRADE_ALIASES = {
        '小一':'p.1','小二':'p.2','小三':'p.3','小四':'p.4','小五':'p.5','小六':'p.6',
        'p1':'p.1','p2':'p.2','p3':'p.3','p4':'p.4','p5':'p.5','p6':'p.6',
        '初小':'p.1 p.2 p.3','高小':'p.4 p.5 p.6','小學':'p.1 p.2 p.3 p.4 p.5 p.6'
    };

    const FREE_WORDS = ['免費','全免','免費參加','free','$0','零費用'];
    const PAID_WORDS = ['付費','收費','需繳費','paid'];
    const TEAM_WORDS = ['團體','隊制','隊伍','小組','學校推薦','team'];
    const INDIV_WORDS = ['個人','個人賽','單人','individual'];

    const HOT_SEARCHES = ['STEAM','奧數','朗誦','免費','P.5 團體','鋼琴','編程','畫畫','英文','義工'];

    // Precompute normalized haystack for every competition
    competitionsData.forEach(c => {
        c.titleLower = c.title.toLowerCase();
        c.tagsLower = c.tags.join(' ').toLowerCase();
        c.haystack = [
            c.title, c.category, c.organizer, c.tags.join(' '), c.aiSummary,
            c.grades.join(' '), c.feeText, c.entryType + '賽',
            c.deadline, `${c.deadline.slice(0,4)}年${Number(c.deadline.slice(5,7))}月`,
            `${Number(c.deadline.slice(5,7))}月`,
            c.fee === 0 ? '免費 全免 free $0' : '付費 收費',
            CATEGORY_KEYWORDS[c.category] || ''
        ].join(' ').toLowerCase();
    });

    function normalize(str) { return String(str).toLowerCase().replace(/\s+/g, ' ').trim(); }

    // Expand one query token into equivalent search variants
    function expandToken(token) {
        const t = normalize(token);
        const out = new Set([t]);
        if (!t) return [];
        if (GRADE_ALIASES[t]) GRADE_ALIASES[t].split(' ').forEach(v => out.add(v));
        if (FREE_WORDS.includes(t)) out.add('免費'), out.add('全免');
        if (PAID_WORDS.includes(t)) out.add('付費');
        if (TEAM_WORDS.includes(t)) out.add('團體');
        if (INDIV_WORDS.includes(t)) out.add('個人');
        // Category synonym expansion
        if (t.length >= 2) {
            Object.keys(CATEGORY_KEYWORDS).forEach(cat => {
                const words = (cat + ' ' + CATEGORY_KEYWORDS[cat]).toLowerCase();
                if (words.includes(t)) out.add(cat);
            });
        }
        return [...out].filter(Boolean);
    }

    // Score a competition against a full query. 0 = no match (AND semantics)
    function scoreCompetition(comp, query) {
        const tokens = normalize(query).split(' ').filter(Boolean);
        if (!tokens.length) return 1;
        let total = 0;
        for (const tok of tokens) {
            const variants = expandToken(tok);
            let tokenScore = 0;
            for (const v of variants) {
                if (!comp.haystack.includes(v)) continue;
                tokenScore += 3;
                if (comp.titleLower.includes(v)) tokenScore += 6;
                if (comp.tagsLower.includes(v)) tokenScore += 3;
                if (comp.category.toLowerCase().includes(v)) tokenScore += 4;
            }
            if (tokenScore === 0) return 0; // every token must match somewhere
            total += tokenScore;
        }
        if (comp.haystack.includes(normalize(query))) total += 8; // phrase bonus
        return total;
    }

    function highlightText(text, tokens) {
        let html = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const variants = new Set();
        tokens.forEach(t => expandToken(t).forEach(v => { if (v.length >= 2) variants.add(v); }));
        [...variants].sort((a,b) => b.length - a.length).forEach(v => {
            const escaped = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            html = html.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
        });
        return html;
    }

    try { recentSearches = JSON.parse(localStorage.getItem('compradar_recent') || '[]'); } catch (e) { recentSearches = []; }

    const REF_TODAY = new Date();
    REF_TODAY.setHours(0, 0, 0, 0);

    function getDaysLeft(deadlineStr) {
        const target = new Date(deadlineStr + 'T23:59:59');
        return Math.ceil((target - REF_TODAY) / 86400000);
    }

    function fmtDate(d) {
        return new Date(d + 'T00:00:00').toLocaleDateString('zh-HK', { year:'numeric', month:'long', day:'numeric' });
    }

    /* ============================================================
       4. UI HELPERS
       ============================================================ */
    function initModalCheckboxes() {
        document.getElementById('filterCategoryContainer').innerHTML = categoriesList.map(cat => `
            <label class="flex items-center space-x-1.5 p-2 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer">
                <input type="checkbox" name="modalCat" value="${cat}" checked onchange="applyFilters()" class="accent-brand-600">
                <span class="truncate">${cat}</span>
            </label>`).join('');
    }

    function renderRecent() {
        const wrap = document.getElementById('recentWrap');
        const chips = document.getElementById('recentChips');
        if (!recentSearches.length) { wrap.classList.add('hidden'); return; }
        wrap.classList.remove('hidden');
        chips.innerHTML = recentSearches.map(q => `
            <button onclick="runHotSearch('${q.replace(/'/g, "\\'")}')" class="bg-white border border-slate-200 hover:border-brand-600 text-slate-600 px-2.5 py-1 rounded-full text-[11px]">
                <i class="fa-solid fa-clock-rotate-left mr-1 text-slate-300"></i>${q}
            </button>`).join('');
    }

    function pushRecent(q) {
        q = normalize(q);
        if (!q) return;
        recentSearches = [q, ...recentSearches.filter(x => x !== q)].slice(0, 6);
        try { localStorage.setItem('compradar_recent', JSON.stringify(recentSearches)); } catch (e) {}
        renderRecent();
    }

    function clearRecent() {
        recentSearches = [];
        try { localStorage.removeItem('compradar_recent'); } catch (e) {}
        renderRecent();
    }

    function updateClearButton() {
        const v = document.getElementById('searchInput').value;
        document.getElementById('clearBtn').classList.toggle('hidden', !v);
    }

    /* ============================================================
       5. SEARCH ACTIONS
       ============================================================ */
    function onSearchInput() {
        updateClearButton();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            activeQuery = document.getElementById('searchInput').value;
            applyFilters();
        }, 120);
    }

    function commitSearch() {
        activeQuery = document.getElementById('searchInput').value;
        pushRecent(activeQuery);
        applyFilters();
    }

    function runHotSearch(q) {
        const input = document.getElementById('searchInput');
        input.value = q;
        activeQuery = q;
        pushRecent(q);
        updateClearButton();
        applyFilters();
        document.getElementById('mainContent').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        activeQuery = '';
        updateClearButton();
        applyFilters();
    }

    /* ============================================================
       6. MAIN FILTER / RENDER
       ============================================================ */
    function applyFilters() {
        const query = normalize(activeQuery);
        const tokens = query.split(' ').filter(Boolean);
        const gradeFilter = document.getElementById('filterGrade').value;
        const feeRadio = document.querySelector('input[name="feeFilter"]:checked').value;
        const entryIndividual = document.getElementById('entryIndividual').checked;
        const entryTeam = document.getElementById('entryTeam').checked;
        const sortBy = document.getElementById('sortBy').value;

        let results = competitionsData.filter(comp => {
            if (getDaysLeft(comp.deadline) < 0) return false;                        // never show expired
            if (!selectedCategories.includes(comp.category)) return false;
            if (gradeFilter !== 'ALL') {
                if (gradeFilter === 'Lower') { if (!comp.grades.some(g => ['P.1','P.2','P.3'].includes(g))) return false; }
                else if (gradeFilter === 'Upper') { if (!comp.grades.some(g => ['P.4','P.5','P.6'].includes(g))) return false; }
                else if (!comp.grades.includes(gradeFilter)) return false;
            }
            if (feeRadio === 'FREE' && comp.fee > 0) return false;
            if (feeRadio === 'PAID' && comp.fee === 0) return false;
            const isInd = comp.entryType.includes('個人');
            const isTm = comp.entryType.includes('團體');
            if (isInd && !entryIndividual && !isTm) return false;
            if (isTm && !entryTeam && !isInd) return false;

            if (query) {
                const score = scoreCompetition(comp, query);
                if (score === 0) return false;
                comp._score = score;
            }
            return true;
        });

        if (sortBy === 'relevance' && query) results.sort((a,b) => (b._score||0) - (a._score||0));
        else if (sortBy === 'deadline_asc' || (!query && sortBy === 'relevance')) results.sort((a,b) => getDaysLeft(a.deadline) - getDaysLeft(b.deadline));
        else if (sortBy === 'popular') results.sort((a,b) => (b.id % 7) - (a.id % 7));
        else if (sortBy === 'fee_asc') results.sort((a,b) => a.fee - b.fee);

        updateMeta(tokens, results.length);
        updateFilterDot();
        renderCompetitions(results, tokens);
    }

    function updateMeta(tokens, count) {
        const meta = document.getElementById('searchMeta');
        const metaText = document.getElementById('searchMetaText');
        const activeFilters = selectedCategories.length !== categoriesList.length;

        if (tokens.length) {
            meta.classList.remove('hidden');
            const chips = tokens.map(t => `<span class="bg-brand-50 text-brand-700 px-1.5 py-0.5 rounded font-semibold">${t}</span>`).join(' ');
            metaText.innerHTML = `搜尋 ${chips} → 找到 <b>${count}</b> 項`;
        } else if (activeFilters) {
            meta.classList.remove('hidden');
            metaText.innerHTML = `已篩選 <b>${selectedCategories.length}</b> 個類別 → 找到 <b>${count}</b> 項`;
        } else {
            meta.classList.add('hidden');
        }
    }

    function updateFilterDot() {
        const isFiltered = selectedCategories.length !== categoriesList.length
            || document.getElementById('filterGrade').value !== 'ALL'
            || document.querySelector('input[name="feeFilter"]:checked').value !== 'ALL'
            || !document.getElementById('entryIndividual').checked
            || !document.getElementById('entryTeam').checked;
        document.getElementById('filterDot').classList.toggle('hidden', !isFiltered);
    }

    function renderCompetitions(items, tokens = []) {
        const listEl = document.getElementById('competitionList');
        document.getElementById('resultCount').innerText = `共 ${items.length} 項`;
        document.getElementById('feedTitle').innerHTML = tokens.length
            ? `🔍 「${tokens.join(' ')}」搜尋結果`
            : (selectedCategories.length === categoriesList.length ? '🟢 所有可報名之學界比賽' : `📂 ${selectedCategories.join('、')}`);

        if (!items.length) {
            listEl.innerHTML = `
                <div class="text-center py-10 bg-white rounded-2xl border border-slate-200">
                    <i class="fa-solid fa-magnifying-glass text-3xl text-slate-300 mb-2"></i>
                    <p class="text-xs text-slate-700 font-semibold mb-1">找不到符合的比賽</p>
                    <p class="text-[11px] text-slate-400 mb-3">試試其他關鍵字，例如：免費、P.5、STEAM、奧數</p>
                    <div class="flex flex-wrap justify-center gap-1.5 px-6">
                        ${HOT_SEARCHES.slice(0,5).map(q => `<button onclick="runHotSearch('${q}')" class="bg-slate-100 hover:bg-brand-50 text-slate-600 text-[11px] px-2.5 py-1 rounded-full">${q}</button>`).join('')}
                    </div>
                </div>`;
            return;
        }

        listEl.innerHTML = items.map(comp => {
            const daysLeft = getDaysLeft(comp.deadline);
            const urgent = daysLeft <= 7;
            return `
            <div onclick="openModal(${comp.id})" class="bg-white hover:border-brand-600 border border-slate-200 p-4 rounded-2xl shadow-sm transition cursor-pointer group">
                <div class="flex justify-between items-start mb-1.5">
                    <div class="flex items-center space-x-2 min-w-0">
                        <span class="bg-brand-50 text-brand-600 text-[10px] px-2 py-0.5 rounded-full font-bold shrink-0">${comp.category}</span>
                        <span class="text-[11px] text-slate-400 truncate"><i class="fa-solid fa-building-columns mr-1"></i>${comp.organizer}</span>
                    </div>
                    <span class="text-xs shrink-0 ml-2 ${urgent ? 'text-red-600 font-bold bg-red-50 px-2 py-0.5 rounded-full' : 'text-emerald-700 bg-emerald-50 font-semibold px-2 py-0.5 rounded-full'}">
                        ⏰ ${daysLeft} 天
                    </span>
                </div>
                <h4 class="font-bold text-sm text-slate-800 mb-1.5 group-hover:text-brand-600 transition">${highlightText(comp.title, tokens)}</h4>
                <div class="flex flex-wrap items-center gap-2 text-[11px] text-slate-600">
                    <span class="bg-slate-100 px-2 py-0.5 rounded-md"><i class="fa-solid fa-graduation-cap mr-1 text-slate-400"></i>${comp.grades.join(', ')}</span>
                    <span class="bg-slate-100 px-2 py-0.5 rounded-md"><i class="fa-solid fa-tag mr-1 text-slate-400"></i>${comp.feeText}</span>
                    <span class="bg-slate-100 px-2 py-0.5 rounded-md"><i class="fa-solid fa-users mr-1 text-slate-400"></i>${comp.entryType}賽</span>
                </div>
            </div>`;
        }).join('');
    }

    /* ============================================================
       7. CATEGORY / FILTER ACTIONS
       ============================================================ */
    function quickCategory(cat) {
        document.querySelectorAll('.cat-pill').forEach(btn => {
            const isActive = (cat === '全部' && btn.innerText.trim() === '全部') || (cat !== '全部' && btn.innerText.trim() === cat.replace('項目',''));
            btn.classList.toggle('bg-brand-600', isActive);
            btn.classList.toggle('text-white', isActive);
            btn.classList.toggle('bg-white', !isActive);
            btn.classList.toggle('text-slate-700', !isActive);
            btn.classList.toggle('border', !isActive);
            btn.classList.toggle('border-slate-200', !isActive);
        });
        selectedCategories = cat === '全部' ? [...categoriesList] : [cat];
        document.querySelectorAll('input[name="modalCat"]').forEach(cb => cb.checked = selectedCategories.includes(cb.value));
        applyFilters();
    }

    function openFilterModal() { document.getElementById('filterModal').classList.remove('hidden'); }
    function closeFilterModal() { document.getElementById('filterModal').classList.add('hidden'); }

    function applyAdvancedFilters() {
        const checked = [...document.querySelectorAll('input[name="modalCat"]:checked')].map(cb => cb.value);
        if (checked.length) selectedCategories = checked;
        closeFilterModal();
        applyFilters();
    }

    function resetAdvancedFilters() {
        document.getElementById('searchInput').value = '';
        activeQuery = '';
        document.getElementById('filterGrade').value = 'ALL';
        document.querySelector('input[name="feeFilter"][value="ALL"]').checked = true;
        document.getElementById('entryIndividual').checked = true;
        document.getElementById('entryTeam').checked = true;
        document.getElementById('sortBy').value = 'relevance';
        selectedCategories = [...categoriesList];
        document.querySelectorAll('input[name="modalCat"]').forEach(cb => cb.checked = true);
        updateClearButton();
        closeFilterModal();
        quickCategory('全部');
    }

    /* ============================================================
       8. DETAIL MODAL / TABS
       ============================================================ */
    function openModal(id) {
        const comp = competitionsData.find(c => c.id === id);
        if (!comp) return;
        const daysLeft = getDaysLeft(comp.deadline);
        document.getElementById('modalCategory').innerText = comp.category;
        document.getElementById('modalTitle').innerText = comp.title;
        document.getElementById('modalOrganizer').innerHTML = `<i class="fa-solid fa-building-columns mr-1"></i> 主辦: ${comp.organizer}`;
        document.getElementById('modalAiSummary').innerText = comp.aiSummary;
        document.getElementById('modalGrades').innerText = comp.grades.join(', ');
        document.getElementById('modalFee').innerText = comp.feeText;
        document.getElementById('modalDeadline').innerText = `${fmtDate(comp.deadline)} (剩餘 ${daysLeft} 天)`;
        document.getElementById('modalEntryType').innerText = comp.entryType + '賽';
        document.getElementById('modalSourceLink').href = comp.url;
        document.getElementById('detailModal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

    function switchTab(tab) {
        ['home','browse','bookmarks','settings'].forEach(t => {
            const btn = document.getElementById(`nav-${t}`);
            btn.classList.toggle('text-brand-600', t === tab);
            btn.classList.toggle('font-semibold', t === tab);
            btn.classList.toggle('text-slate-500', t !== tab);
        });
        if (tab === 'bookmarks') {
            document.getElementById('feedTitle').innerText = '⭐ 已收藏的有效比賽';
            const saved = competitionsData.filter(c => c.isBookmarked && getDaysLeft(c.deadline) >= 0);
            document.getElementById('resultCount').innerText = `共 ${saved.length} 項`;
            renderCompetitions(saved);
        } else if (tab === 'browse') {
            resetAdvancedFilters();
        } else if (tab === 'settings') {
            document.getElementById('mainContent').innerHTML = `
                <div class="p-4 space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200">
                        <h3 class="font-bold text-sm text-slate-800 mb-2">👤 用戶身份</h3>
                        <p class="text-xs text-slate-500 mb-3">香港小學教師 / STEAM 統籌主任</p>
                        <div class="space-y-2 text-xs">
                            <label class="flex items-center justify-between p-2 bg-slate-50 rounded-xl"><span>每日 07:00 推送新比賽</span><input type="checkbox" checked class="accent-brand-600"></label>
                            <label class="flex items-center justify-between p-2 bg-slate-50 rounded-xl"><span>自動隱藏已截止比賽</span><input type="checkbox" checked class="accent-brand-600"></label>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-200">
                        <h3 class="font-bold text-sm text-slate-800 mb-2">🔔 關注科目</h3>
                        <div class="flex flex-wrap gap-2 text-xs">
                            <span class="bg-brand-50 text-brand-600 px-3 py-1 rounded-lg font-semibold">11 大學科全部已啟用 ✓</span>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-200">
                        <h3 class="font-bold text-sm text-slate-800 mb-2">🔍 搜尋能力</h3>
                        <ul class="text-[11px] text-slate-600 space-y-1">
                            <li>• 多關鍵字以空格分隔（AND 邏輯）</li>
                            <li>• 同義詞：STEM / 編程 / AI → STEAM</li>
                            <li>• 年級：P.5、小五、高小</li>
                            <li>• 條件：免費、付費、個人、團體</li>
                        </ul>
                    </div>
                </div>`;
        } else {
            location.reload();
        }
    }

    function toggleNotifications() {
        alert('通知中心：目前有 ' + competitionsData.filter(c => getDaysLeft(c.deadline) >= 0 && getDaysLeft(c.deadline) <= 14).length + ' 項比賽將於兩週內截止！');
    }

    /* ============================================================
       9. INIT
       ============================================================ */
    document.getElementById('dataDate').innerText = `資料更新：${new Date().toLocaleDateString('zh-HK',{year:'numeric',month:'long',day:'numeric'})} • 30 項比賽`;
    initModalCheckboxes();
    renderRecent();
    applyFilters();
    </script>
</body>
</html>
